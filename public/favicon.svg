<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="swGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="swAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Dark Octagonal / Rounded Tech Squircle -->
  <rect width="100" height="100" rx="26" fill="#06090E"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="24" stroke="url(#swGrad)" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- Letter 'S' (Futuristic Angular Circuit) -->
  <path d="M 46 30 L 26 30 L 26 48 L 46 52 L 46 70 L 24 70" 
        stroke="url(#swGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Letter 'W' (Interlocking Geometric Peaks) -->
  <path d="M 54 30 L 59 70 L 68 46 L 77 70 L 83 30" 
        stroke="url(#swAccent)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- IoT / AI Terminal Circuit Dots -->
  <circle cx="26" cy="30" r="3" fill="#34D399"/>
  <circle cx="24" cy="70" r="3" fill="#10B981"/>
  <circle cx="54" cy="30" r="3" fill="#2DD4BF"/>
  <circle cx="68" cy="46" r="3" fill="#F59E0B"/>
  <circle cx="83" cy="30" r="3" fill="#34D399"/>
</svg>
